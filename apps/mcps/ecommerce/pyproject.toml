[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-ecommerce-mcp"
version = "0.1.0"
description = "Excel-backed ecommerce MCP demonstration server."
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "openpyxl>=3.1.5,<4", "filelock>=3.20,<4"]

[project.scripts]
ecommerce-mcp = "ecommerce_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
