[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-platform-server"
version = "0.1.0"
description = "API for the Agent Tool Experiment Platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.6,<3.0",
]

[project.scripts]
agent-platform-api = "api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/core"]
