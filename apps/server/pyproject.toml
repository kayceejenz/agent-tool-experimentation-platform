[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-platform-server"
version = "0.1.0"
description = "API for the Agent Tool Experiment Platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "pglast>=8,<9",
  "argon2-cffi>=25.1,<26",
  "PyJWT>=2.12,<3",
  "cryptography>=46,<49",
]

[project.scripts]
agent-platform-api = "api.main:run"
agent-platform-migrate = "migrations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/core", "src/integrations", "src/migrations", "src/modules"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires AGENT_TEST_DATABASE_URL pointing to a dedicated test database"]
