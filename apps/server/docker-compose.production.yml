name: agent-platform

x-runtime: &runtime
  image: ${AGENT_APP_IMAGE:-agent-platform:production}
  env_file:
    - ${AGENT_RUNTIME_ENV_FILE:-.env.runtime}
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=256m,mode=1777
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  environment:
    AGENT_APP_ENV: production
    AGENT_FILE_STORAGE_BACKEND: r2
    AGENT_API_HOST: 0.0.0.0
    AGENT_API_PORT: '8001'
    AGENT_DATASET_STORAGE_ROOT: /tmp/agent-datasets
    AGENT_SANDBOX_STORAGE_ROOT: ${AGENT_WORKSPACE_ROOT:-/srv/agent-platform/sandboxes}
    AGENT_SANDBOX_MEMORY_MB: ${AGENT_SANDBOX_MEMORY_MB:-512}
    AGENT_SANDBOX_CPUS: ${AGENT_SANDBOX_CPUS:-0.5}

services:
  api:
    <<: *runtime
    command: agent-platform-api
    ports:
      - '127.0.0.1:${AGENT_API_HOST_PORT:-8001}:8001'
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *runtime
    profiles: [analysis]
    command: agent-platform-worker
    mem_limit: 256m
    cpus: 0.75
    group_add:
      - '${AGENT_DOCKER_GID:?Set the host Docker socket group ID}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind paths must be identical on the host and worker: the HOST daemon
      # resolves child sandbox mounts. Never replace this with an anonymous volume.
      - ${AGENT_WORKSPACE_ROOT:-/srv/agent-platform/sandboxes}:${AGENT_WORKSPACE_ROOT:-/srv/agent-platform/sandboxes}
    stop_grace_period: 45s

  migrate:
    image: ${AGENT_APP_IMAGE:-agent-platform:production}
    profiles: [tools]
    env_file:
      - ${AGENT_MIGRATION_ENV_FILE:-.env.prod}
    command: agent-platform-migrate
    init: true
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
